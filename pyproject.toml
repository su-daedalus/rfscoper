[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rfscoper"
dynamic = ["version"]
description = "Offline RF analyzer for the HackRF: live scope, near-field probing, capture, compare and identify."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "su-daedalus" }]
keywords = ["sdr", "hackrf", "rf", "spectrum-analyzer", "radio", "tscm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.22", "matplotlib>=3.5"]

[project.optional-dependencies]
app = ["PyQt6>=6.4"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[project.scripts]
rfscoper = "rfscoper.cli:main"

[project.urls]
Homepage = "https://github.com/su-daedalus/rfscoper"
Issues = "https://github.com/su-daedalus/rfscoper/issues"
Changelog = "https://github.com/su-daedalus/rfscoper/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "rfscoper.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rfscoper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["rfscoper"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/rfscoper/app.py" = ["E501"]  # Qt stylesheet and status-line strings

[tool.mypy]
python_version = "3.10"
files = ["src"]

warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["rfscoper.app", "rfscoper.qt"]
disable_error_code = ["attr-defined", "union-attr", "misc", "arg-type", "call-arg"]
